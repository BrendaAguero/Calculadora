<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sin conexión · Calculadora Emprender</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; background: #fafafa; color: #171717; padding: 24px; box-sizing: border-box; }
  @media (prefers-color-scheme: dark) { body { background: #0a0a0a; color: #f5f5f5; } p { color: #a3a3a3 !important; } }
  main { max-width: 320px; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { color: #525252; font-size: 14px; line-height: 1.5; }
  button { margin-top: 16px; width: 100%; padding: 12px; border: 0; border-radius: 12px; background: #c2410c; color: #fff; font-size: 16px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>Estás sin conexión</h1>
  <p>Para usar la app necesitás internet. Revisá tu wifi o tus datos y probá de nuevo. Tus datos están guardados en la nube: no se perdió nada.</p>
  <button onclick="location.reload()">Probar de nuevo</button>
</main>
<script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
